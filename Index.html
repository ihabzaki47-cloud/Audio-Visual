<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Digital Audio-Visual Player OOP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center flex-col 
p-6">
  <div class="bg-slate-800 p-6 rounded-xl shadow-2xl w-full max-w-lg border border-slate-700">
    <h1 class="text-2xl font-bold text-sky-400 text-center mb-4">SMK Tunas Media Audio-Visual</
h1>
    <!-- Graphic Canvas Multimedia -->
    <canvas id="visualizerCanvas" class="w-full h-40 bg-slate-950 rounded-lg mb-4 border 
border-slate-800"></canvas>
    <!-- Track Info -->
    <div class="text-center mb-4">
      <h2 id="trackTitle" class="text-lg font-semibold text-slate-200">Belum Ada Musik</h2>
      <p id="trackArtist" class="text-sm text-slate-400">Silakan Pilih Lagu</p>
    </div>
    <!-- Control Buttons -->
    <div class="flex justify-center gap-4 mb-4">
      <button id="playBtn" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg font
bold">PLAY</button>
      <button id="pauseBtn" class="bg-amber-600 hover:bg-amber-500 px-6 py-2 rounded-lg font
bold">PAUSE</button>
      <button id="stopBtn" class="bg-red-600 hover:bg-red-500 px-6 py-2 rounded-lg font
bold">STOP</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html
